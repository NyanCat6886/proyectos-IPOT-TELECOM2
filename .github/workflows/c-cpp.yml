name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile main program
        run: gcc -Wall -Wextra -std=c11 main.c -o main
      - name: compile calc 
        run:  gcc -Wall -Wextra -std=c11 calculadora.c -o calculadora
      - name: Compile conv
        run: gcc -Wall -Wextra -std=c11 conversiones.c -o conversiones
       
